name: Hiperfoco preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exacto de Netlify
        run: |
          node scripts/fetch-approved-product-images.mjs
          node scripts/merge-affiliate-overrides.mjs
          node scripts/affiliate-sync.mjs
          node scripts/restore-approved-images.mjs
          node scripts/inject-gift-fallback.mjs
          node scripts/weekly-inject.mjs
          node scripts/fix-static-images.mjs
          node scripts/fix-home-gift-images.mjs
          node scripts/seo-build.mjs
          node scripts/inject-affiliate-catalog.mjs
          node scripts/inject-product-image-fixes.mjs
          node scripts/inject-shell-ux.mjs
          node scripts/apply-approved-product-images.mjs
          node scripts/approved-image-audit.mjs
          node scripts/build-sitemap.mjs
          node scripts/home-image-audit.mjs
      - name: Auditoría estricta
        run: node scripts/preflight-audit.mjs
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: preflight-report.json
      - name: Esperar Deploy Preview
        if: github.event_name == 'pull_request'
        run: |
          URL="https://deploy-preview-${{ github.event.number }}--hiperfoco.netlify.app"
          for i in {1..45}; do
            if curl -fsS "$URL" >/dev/null; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Instalar navegador QA
        if: github.event_name == 'pull_request'
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capturas visuales de preview
        if: github.event_name == 'pull_request'
        run: |
          URL="https://deploy-preview-${{ github.event.number }}--hiperfoco.netlify.app"
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page "$URL" qa-home-desktop.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page "$URL" qa-home-mobile.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page "$URL/regalos/" qa-regalos-desktop.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page "$URL/regalos/" qa-regalos-mobile.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page "$URL/reviews/" qa-reviews-desktop.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page "$URL/reviews/" qa-reviews-mobile.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page "$URL/categoria/cafe.html" qa-cafe-desktop.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page "$URL/categoria/cafe.html" qa-cafe-mobile.png
      - name: Guardar capturas QA
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: qa-*.png
          if-no-files-found: error

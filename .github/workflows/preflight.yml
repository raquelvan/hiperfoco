name: Hiperfoco preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exacto de Netlify
        run: |
          node scripts/fetch-approved-product-images.mjs
          node scripts/merge-affiliate-overrides.mjs
          node scripts/affiliate-sync.mjs
          node scripts/restore-approved-images.mjs
          node scripts/inject-gift-fallback.mjs
          node scripts/weekly-inject.mjs
          node scripts/fix-static-images.mjs
          node scripts/fix-home-gift-images.mjs
          node scripts/seo-build.mjs
          node scripts/inject-affiliate-catalog.mjs
          node scripts/inject-product-image-fixes.mjs
          node scripts/inject-shell-ux.mjs
          node scripts/apply-approved-product-images.mjs
          node scripts/approved-image-audit.mjs
          node scripts/build-sitemap.mjs
          node scripts/home-image-audit.mjs
      - name: Auditoría estricta
        run: node scripts/preflight-audit.mjs
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: preflight-report.json
      - name: Esperar Deploy Preview
        if: github.event_name == 'pull_request'
        run: |
          URL="https://deploy-preview-${{ github.event.number }}--hiperfoco.netlify.app"
          for i in {1..45}; do
            if curl -fsS "$URL" >/dev/null; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Instalar navegador QA
        if: github.event_name == 'pull_request'
        run: npx -y playwright@1.55.0 install chromium
      - name: Capturas visuales de preview
        if: github.event_name == 'pull_request'
        run: |
          URL="https://deploy-preview-${{ github.event.number }}--hiperfoco.netlify.app"
          shot () {
            NAME="$1"; SIZE="$2"; PATHNAME="$3"
            npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size="$SIZE" --full-page "$URL$PATHNAME" "$NAME.png"
          }
          shot qa-home-desktop "1440,1000" "/"
          shot qa-home-mobile "390,844" "/"
          shot qa-regalos-desktop "1440,1000" "/regalos/"
          shot qa-regalos-mobile "390,844" "/regalos/"
          shot qa-reviews-desktop "1440,1000" "/reviews/"
          shot qa-reviews-mobile "390,844" "/reviews/"
          shot qa-cafe-desktop "1440,1000" "/categoria/cafe.html"
          shot qa-cafe-mobile "390,844" "/categoria/cafe.html"
          shot qa-categorias-desktop "1440,1000" "/categoria/"
          shot qa-categorias-mobile "390,844" "/categoria/"
          shot qa-comparativas-desktop "1440,1000" "/comparativas/"
          shot qa-comparativas-mobile "390,844" "/comparativas/"
          shot qa-guias-desktop "1440,1000" "/guias/"
          shot qa-guias-mobile "390,844" "/guias/"
          shot qa-selecciones-desktop "1440,1000" "/selecciones/"
          shot qa-selecciones-mobile "390,844" "/selecciones/"
      - name: Guardar capturas QA
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: qa-*.png
          if-no-files-found: error

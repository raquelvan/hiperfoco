name: Hiperfoco preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build sin despliegue
        run: |
          node scripts/merge-affiliate-overrides.mjs
          node scripts/affiliate-sync.mjs
          node scripts/restore-approved-images.mjs
          node scripts/inject-gift-fallback.mjs
          node scripts/weekly-inject.mjs
          node scripts/fix-static-images.mjs
          node scripts/seo-build.mjs
          node scripts/inject-affiliate-catalog.mjs
          node scripts/inject-product-image-fixes.mjs
          node scripts/inject-shell-ux.mjs
          node scripts/build-sitemap.mjs
      - name: Auditoría estricta
        run: node scripts/preflight-audit.mjs
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: preflight-report.json

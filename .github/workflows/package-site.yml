name: Package site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: hiperfoco-source
          path: .
          include-hidden-files: true
          retention-days: 1

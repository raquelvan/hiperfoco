# Affiliate price sync trigger: 2026-08-17
[build]
  command = "node scripts/fetch-approved-product-images.mjs && node scripts/merge-affiliate-overrides.mjs && node scripts/affiliate-sync.mjs && node scripts/restore-approved-images.mjs && node scripts/inject-gift-fallback.mjs && node scripts/weekly-inject.mjs && node scripts/fix-static-images.mjs && node scripts/fix-home-gift-images.mjs && node scripts/normalize-review-images.mjs && node scripts/seo-build.mjs && node scripts/inject-affiliate-catalog.mjs && node scripts/inject-product-image-fixes.mjs && node scripts/inject-shell-ux.mjs && node scripts/fix-forms.mjs && node scripts/apply-approved-product-images.mjs && node scripts/approved-image-audit.mjs && node scripts/build-search.mjs && node scripts/build-sitemap.mjs && node scripts/home-image-audit.mjs && (node scripts/preflight-audit.mjs || [ \"$CONTEXT\" = \"deploy-preview\" ])"
  publish = "."

# Consolidación de URLs legacy: una sola URL canónica por intención.
[[redirects]]
  from = "/categorias"
  to = "/categoria/"
  status = 301

[[redirects]]
  from = "/categorias/"
  to = "/categoria/"
  status = 301

[[redirects]]
  from = "/categorias/*"
  to = "/categoria/:splat"
  status = 301

[[redirects]]
  from = "/necesidades"
  to = "/selecciones/"
  status = 301

[[redirects]]
  from = "/necesidades/"
  to = "/selecciones/"
  status = 301

[[redirects]]
  from = "/necesidades/*"
  to = "/selecciones/:splat"
  status = 301

[[redirects]]
  from = "/legal/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/selecciones/menos-de-300.html"
  to = "/selecciones/menos-300.html"
  status = 301

[[redirects]]
  from = "/selecciones/cocinas-pequenas.html"
  to = "/selecciones/cocina-pequena.html"
  status = 301

[[redirects]]
  from = "/selecciones/faciles-de-limpiar.html"
  to = "/selecciones/limpiar-poco.html"
  status = 301

# GSC ha descubierto variantes sin .html. Las consolidamos para que señales,
# enlaces y futuras impresiones terminen siempre en la URL canónica del sitemap.
[[redirects]]
  from = "/categoria/cocina"
  to = "/categoria/cocina.html"
  status = 301

[[redirects]]
  from = "/comparativas/philips-3300-vs-5500"
  to = "/comparativas/philips-3300-vs-5500.html"
  status = 301

[[redirects]]
  from = "/guias/mejores-aspiradoras-sin-cable-2026"
  to = "/guias/mejores-aspiradoras-sin-cable-2026.html"
  status = 301

[[redirects]]
  from = "/guias/mejores-auriculares-inalambricos-2026"
  to = "/guias/mejores-auriculares-inalambricos-2026.html"
  status = 301

[[redirects]]
  from = "/guias/mejores-robots-aspiradores-2026"
  to = "/guias/mejores-robots-aspiradores-2026.html"
  status = 301

[[redirects]]
  from = "/regalos/quien-ya-tiene-de-todo"
  to = "/regalos/quien-ya-tiene-de-todo.html"
  status = 301

[[redirects]]
  from = "/regalos/regalos-para-hermana"
  to = "/regalos/regalos-para-hermana.html"
  status = 301

[[redirects]]
  from = "/regalos/regalos-para-novio"
  to = "/regalos/regalos-para-novio.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Affiliate price sync trigger: 2026-08-17
[build]
  command = "node scripts/affiliate-sync.mjs && node scripts/inject-gift-fallback.mjs && node scripts/seo-build.mjs && node scripts/weekly-inject.mjs && node scripts/inject-affiliate-catalog.mjs && node scripts/inject-product-image-fixes.mjs && node scripts/inject-shell-ux.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

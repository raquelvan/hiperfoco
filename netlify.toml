# Affiliate price sync trigger: 2026-08-17
[build]
  command = "node scripts/affiliate-sync.mjs && node scripts/inject-gift-fallback.mjs && node scripts/seo-build.mjs && node scripts/weekly-inject.mjs && node scripts/inject-affiliate-catalog.mjs && node scripts/inject-product-image-fixes.mjs && node scripts/inject-shell-ux.mjs && node scripts/build-sitemap.mjs"
  publish = "."

[[redirects]]
  from = "/selecciones/menos-de-300.html"
  to = "/selecciones/menos-300.html"
  status = 301

[[redirects]]
  from = "/selecciones/cocinas-pequenas.html"
  to = "/selecciones/cocina-pequena.html"
  status = 301

[[redirects]]
  from = "/selecciones/faciles-de-limpiar.html"
  to = "/selecciones/limpiar-poco.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"
